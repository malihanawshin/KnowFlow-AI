[project]
name = "knowflow-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "PyMuPDF>=1.24,<2",
    "psycopg[binary]>=3.2,<4",
    "openai>=1.60,<3",
    "python-multipart>=0.0.20,<1",
    "python-dotenv>=1,<2",
]

[tool.vercel]
entrypoint = "backend.main:app"
